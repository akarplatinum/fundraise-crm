name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The web tests drive the Worker over node:sqlite, which needs 22+.
          node-version: 22
      - run: npm test
