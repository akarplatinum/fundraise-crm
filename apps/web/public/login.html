<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Sign in · Fundraise CRM</title>
    <style>
      /* Palette lifted from index.html so the sign-in doesn't feel like a different product. */
      :root {
        --bg: #090c0a;
        --surface: #10150f;
        --surface2: #151b16;
        --raise: #1a211b;
        --line: #242c26;
        --ink: #eef4ef;
        --ink2: #a4b2aa;
        --muted: #6c7a72;
        --brand: #2bbd76;
        --brand-d: #178a53;
        --red: #e8664f;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.28), 0 6px 18px rgba(0, 0, 0, 0.2),
          0 22px 44px rgba(0, 0, 0, 0.16);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f3f6f3;
          --surface: #ffffff;
          --surface2: #f5f9f6;
          --raise: #ffffff;
          --line: #e8eee9;
          --ink: #0c1712;
          --ink2: #41504a;
          --muted: #6d7c74;
          --brand: #118a4f;
          --brand-d: #0c6e40;
          --shadow: 0 1px 2px rgba(18, 40, 28, 0.04), 0 6px 18px rgba(18, 48, 32, 0.06),
            0 22px 44px rgba(18, 48, 32, 0.05);
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.55 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Inter,
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        letter-spacing: -0.006em;
        display: grid;
        place-items: center;
        padding: 24px;
        position: relative;
        overflow: hidden;
      }
      /* Two soft brand-tinted glows. Pure CSS — no raster assets anywhere in this app. */
      body::before,
      body::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.3;
        pointer-events: none;
        z-index: 0;
      }
      body::before {
        width: 520px;
        height: 520px;
        background: var(--brand);
        top: -190px;
        left: -140px;
      }
      body::after {
        width: 460px;
        height: 460px;
        background: #22aecf;
        bottom: -200px;
        right: -130px;
        opacity: 0.2;
      }
      @media (prefers-reduced-motion: no-preference) {
        body::before {
          animation: drift 22s ease-in-out infinite alternate;
        }
        body::after {
          animation: drift 27s ease-in-out infinite alternate-reverse;
        }
      }
      @keyframes drift {
        to {
          transform: translate3d(48px, 34px, 0) scale(1.1);
        }
      }

      .card {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 392px;
        background: color-mix(in srgb, var(--surface) 86%, transparent);
        backdrop-filter: blur(20px) saturate(1.15);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 34px 32px 28px;
        box-shadow: var(--shadow);
      }
      .mark {
        display: flex;
        align-items: center;
        gap: 11px;
        margin-bottom: 26px;
      }
      .glyph {
        width: 38px;
        height: 38px;
        border-radius: 11px;
        flex: none;
        background: linear-gradient(145deg, var(--brand), var(--brand-d));
        display: grid;
        place-items: center;
        color: #fff;
        font-weight: 800;
        font-size: 17px;
        letter-spacing: -0.04em;
        box-shadow: 0 4px 14px color-mix(in srgb, var(--brand) 40%, transparent);
      }
      .mark .t {
        font-weight: 700;
        font-size: 15px;
        letter-spacing: -0.02em;
      }
      .mark .s {
        color: var(--muted);
        font-size: 12px;
        margin-top: 1px;
      }

      h1 {
        font-size: 21px;
        line-height: 1.25;
        letter-spacing: -0.025em;
        margin: 0 0 6px;
        font-weight: 700;
      }
      .lede {
        color: var(--ink2);
        font-size: 13.5px;
        margin: 0 0 24px;
      }

      label {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        font-weight: 700;
        margin: 0 0 7px;
      }
      .field {
        margin-bottom: 16px;
      }
      input {
        width: 100%;
        background: var(--surface2);
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 12px 14px;
        font-size: 14.5px;
        color: var(--ink);
        font-family: inherit;
        transition:
          border-color 0.16s,
          box-shadow 0.16s;
      }
      input::placeholder {
        color: var(--muted);
      }
      input:focus {
        outline: none;
        border-color: var(--brand);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent);
      }

      button {
        width: 100%;
        margin-top: 6px;
        padding: 12.5px;
        border: 0;
        border-radius: 11px;
        background: linear-gradient(145deg, var(--brand), var(--brand-d));
        color: #fff;
        font-family: inherit;
        font-size: 14.5px;
        font-weight: 650;
        letter-spacing: -0.01em;
        cursor: pointer;
        transition:
          transform 0.13s,
          filter 0.16s,
          opacity 0.16s;
      }
      button:hover:not(:disabled) {
        filter: brightness(1.07);
      }
      button:active:not(:disabled) {
        transform: translateY(1px);
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }

      .err {
        display: none;
        margin: 0 0 16px;
        padding: 10px 13px;
        border-radius: 10px;
        font-size: 13px;
        background: color-mix(in srgb, var(--red) 13%, transparent);
        border: 1px solid color-mix(in srgb, var(--red) 34%, transparent);
        color: var(--red);
      }
      .err.show {
        display: block;
      }
      .foot {
        margin-top: 22px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 11.5px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">
        <div class="glyph">◆</div>
        <div>
          <div class="t">Fundraise CRM</div>
          <div class="s">Investor pipeline &amp; intros</div>
        </div>
      </div>

      <h1>Sign in</h1>
      <p class="lede">Seed round pipeline, investor directory, and intros.</p>

      <div class="err" id="err" role="alert" aria-live="polite"></div>

      <form id="f" autocomplete="on">
        <div class="field">
          <label for="u">Username</label>
          <input
            id="u"
            name="username"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            required
            autofocus
            placeholder="you"
          />
        </div>
        <div class="field">
          <label for="p">Password</label>
          <input
            id="p"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            placeholder="••••••••••••"
          />
        </div>
        <button type="submit" id="btn">Sign in</button>
      </form>

      <div class="foot">Private · authorized users only</div>
    </main>

    <script>
      const f = document.getElementById("f");
      const err = document.getElementById("err");
      const btn = document.getElementById("btn");

      function fail(msg) {
        err.textContent = msg;
        err.classList.add("show");
      }

      f.addEventListener("submit", async (e) => {
        e.preventDefault();
        err.classList.remove("show");
        btn.disabled = true;
        btn.textContent = "Signing in…";
        try {
          const r = await fetch("/api/login", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              username: document.getElementById("u").value,
              password: document.getElementById("p").value,
            }),
          });
          const j = await r.json().catch(() => ({}));
          if (!r.ok) {
            fail(j.error || "Sign-in failed.");
            btn.disabled = false;
            btn.textContent = "Sign in";
            document.getElementById("p").select();
            return;
          }
          // Only same-origin paths — never bounce to an attacker-supplied host.
          const next = new URLSearchParams(location.search).get("next");
          location.replace(next && next.startsWith("/") && !next.startsWith("//") ? next : "/");
        } catch (_) {
          fail("Network error. Try again.");
          btn.disabled = false;
          btn.textContent = "Sign in";
        }
      });
    </script>
  </body>
</html>
