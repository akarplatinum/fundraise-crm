# Cloudflare configuration for the CRM. To rename your deploy, change `name`
# and `database_name` here; nothing else in the repo repeats them. Commands
# refer to the database by its binding, `DB`.
name = "fundraise-crm"
compatibility_date = "2025-01-01"

# Pages, advanced mode: build.js assembles .assets/ with the static UI and a
# _worker.js that runs before every request, so nothing is served without a
# session.
pages_build_output_dir = ".assets"

# `npm run deploy` from the repo root creates the database and writes its id
# here. The placeholder fails loudly if you deploy without doing that, rather
# than writing somewhere unexpected. To do it by hand:
#
#   npx wrangler d1 create <database_name>          # prints the id
#   npx wrangler d1 execute DB --remote --file=schema.sql
#
# If your Cloudflare login has more than one account, export the one you want
# first: export CLOUDFLARE_ACCOUNT_ID=<id>
[[d1_databases]]
binding = "DB"
database_name = "fundraise-crm-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "fundraise-crm-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Secrets, set with `npx wrangler pages secret put <NAME>` and never committed:
#
#   AI_API_KEY         The model provider's key (ANTHROPIC_API_KEY also works).
#                      Safer here than on the Settings page, which stores it
#                      in the database.
#   SESSION_SECRET     Signs the session cookie. Any long random string;
#                      changing it signs everyone out.
#
# Vars:
#   AI_PROVIDER  anthropic (default) or openai, for any OpenAI-compatible API.
#   AI_BASE_URL  The provider's API root, for a proxy or a self-hosted model.
#   MODEL_ID     Model name. Required for openai. See docs/models.md.
#                setup.sh stores these three as secrets, and the Settings
#                page overrides them.
#   SIGNUP_OPEN  "true" lets people create accounts at /signup. Those accounts
#                are never admin, so they cannot change the API key.
#   DECK_UPLOAD  "off" disables deck upload, for an instance whose profile is
#                maintained by hand.
[vars]
SIGNUP_OPEN = "false"
DECK_UPLOAD = "on"
